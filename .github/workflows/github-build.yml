name: Build

on:
  push:
    branches-ignore:
     - gh-pages
  pull_request:
    branches-ignore:
     - gh-pages
  workflow_dispatch:

jobs:
  distribute:
    # Rust has its own native runner matrix. Legacy Java distributions remain
    # available on forks via workflow_dispatch without running for every Rust PR.
    if: github.repository == 't-oster/VisiCut' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false

      matrix:
        target:
          - zip
          - windows-nsis
          - macos-bundle
          - linux-appimage
          - linux-checkinstall

    name: Distribute ${{ matrix.target }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Build distribution
        run: |
          # we use a separate directory called output to "collect" all the build artifacts
          # this makes uploading the artifacts a *lot* easier
          mkdir output
          pushd output
          bash ../distribute/distribute-docker.sh ${{ matrix.target }}

      - name: Archive built files
        uses: actions/upload-artifact@v4.4.3
        with:
          name: output binaries ${{ matrix.target }}
          path: |
            output/*

  upload:
    name: Create release and upload artifacts
    if: github.repository == 't-oster/VisiCut' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - distribute
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4.1.8
      - name: Inspect directory after downloading artifacts
        run: ls -alFR
      - name: Create release and upload artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            wget https://github.com/TheAssassin/pyuploadtool/releases/download/20231223-1/pyuploadtool-x86_64.AppImage
            chmod +x pyuploadtool-x86_64.AppImage
            ./pyuploadtool-x86_64.AppImage --appimage-extract-and-run "output binaries"*/*.*
